name: Atualizar SISCABW diretamente do Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: '15 12 * * 1-5'
  issues:
    types: [opened, reopened]

permissions:
  contents: write

concurrency:
  group: atualizar-siscabw-direto
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'EXECUTAR ATUALIZACAO SISCABW')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da main oficial
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar, validar e publicar
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set +e
          LOG=/tmp/siscabw-update.log
          rm -f "$LOG"
          {
            set -euo pipefail
            echo '=== Dependências ==='
            python3 -m pip install --disable-pip-version-check --quiet google-auth requests openpyxl xlrd

            echo '=== Download das fontes do Drive ==='
            rm -rf /tmp/siscabw-inputs /tmp/siscabw-package /tmp/siscabw-base.zip
            mkdir -p /tmp/siscabw-inputs /tmp/siscabw-package
            python3 automation/download_drive.py \
              --folder-id '1OF-84Nnbfp0y9M-nPDDWQqeeYfjQma-c' \
              --output /tmp/siscabw-inputs \
              --zip-folder-id '1bZ86fqTY99dOiAShwCMydyjo6giAbzlf' \
              --zip-output /tmp/siscabw-base.zip
            unzip -q /tmp/siscabw-base.zip -d /tmp/siscabw-package

            echo '=== Geração ==='
            base64 --decode automation/generate_data.py.gz.b64 | gzip --decompress > /tmp/generate_data.py
            python3 /tmp/generate_data.py --inputs /tmp/siscabw-inputs --repo /tmp/siscabw-package

            echo '=== Validação ==='
            python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/siscabw-package')
          summary = json.loads((root / 'contracts-summary.json').read_text(encoding='utf-8'))
          assert summary['total'] > 0
          assert summary['total'] == sum(summary['counts'].values())
          assert set(summary['counts']) == {'administrativos', 'finalisticos', 'fms'}
          for field in ('valorContrato', 'totalEmpenhadoUsd', 'totalFaturadoUsd'):
              assert round(summary['totals'][field], 2) == round(sum(x[field] for x in summary['byCategory'].values()), 2)
          pairs = {
              'contracts-data.js': 'assets/js/contracts-data.js',
              'credit-data.js': 'assets/js/credit-data.js',
              'rp-data.js': 'assets/js/rp-data.js',
              'suprimento-data.js': 'assets/js/suprimento-data.js',
              'contracts-summary.json': 'assets/data/contracts-summary.json',
              'credit-current.json': 'assets/data/credit-current.json',
              'credit-10062026.json': 'assets/data/credit-10062026.json',
              'credit-11062026.json': 'assets/data/credit-11062026.json',
              'data-update-status.json': 'assets/data/data-update-status.json',
          }
          for source, mirror in pairs.items():
              assert (root / source).read_bytes() == (root / mirror).read_bytes(), (source, mirror)
          text = (root / 'rp-data.js').read_text(encoding='utf-8')
          prefix = 'window.CABW_RP_DATA = '
          assert text.startswith(prefix) and text.rstrip().endswith(';')
          rp = json.loads(text[len(prefix):].rstrip()[:-1])
          assert rp['summary']['totalRegistros'] > 0
          assert rp['rpEvolution']['resumoGeral']['inscrito'] >= rp['rpEvolution']['resumoGeral']['atual']
          for name in ('index.html','contratos.html','credito.html','governanca-rp.html','suprimento-fundos.html'):
              assert (root / name).is_file(), name
          print({'status':'validado','contratos':summary['total'],'rp':rp['summary']['totalRegistros']})
          PY

            echo '=== Sobreposição do ZIP-base validado ==='
            rsync -a --exclude='.git/' --exclude='.github/' --exclude='automation/' --exclude='auth.js' /tmp/siscabw-package/ ./

            echo '=== Commit e publicação ==='
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -f automation/last-update-error.log
            git add -A -- . ':!.github/workflows/promote-tested-siscabw.yml'
            git add .github/workflows/promote-tested-siscabw.yml automation/
            if git diff --cached --quiet; then
              echo 'O SISCABW já contém os dados atuais.'
            else
              git commit -m "Atualiza dados do Painel CABW em $(date -u +'%d-%m-%Y')"
              git push origin HEAD:main
            fi
          } > >(tee "$LOG") 2>&1
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            echo "Falha na atualização; registrando diagnóstico (código $STATUS)."
            mkdir -p automation
            {
              echo "Data UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "Evento: $GITHUB_EVENT_NAME"
              echo "Commit: $GITHUB_SHA"
              echo "Código: $STATUS"
              echo
              tail -c 50000 "$LOG"
            } > automation/last-update-error.log
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add automation/last-update-error.log
            git commit -m 'Registra diagnóstico da atualização do SISCABW' || true
            git pull --rebase origin main || true
            git push origin HEAD:main || true
            exit "$STATUS"
          fi
